name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  # Branch model: features merge into develop; only develop is merged into main (by the maintainer).
  base-branch:
    name: PR targets develop
    if: github.event_name == 'pull_request' && github.base_ref == 'main' && github.head_ref != 'develop'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::error::Pull requests go to 'develop', not 'main'. Change the base branch to develop (Edit next to the PR title)."
          exit 1

  # Releases: a develop -> main PR must carry a new, higher VERSION with a CHANGELOG section.
  version:
    name: Release version
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: |
          new="$(cat VERSION)"
          old="$(git show origin/main:VERSION 2>/dev/null || echo 0.0.0)"
          echo "main is $old, this PR releases $new"
          [[ "$new" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::VERSION must be X.Y.Z, got '$new'"; exit 1; }
          if [ "$new" = "$old" ] || [ "$(printf '%s\n%s\n' "$old" "$new" | sort -V | tail -1)" != "$new" ]; then
            echo "::error::Bump VERSION above $old first: python scripts/bump_version.py patch|minor|major"; exit 1
          fi
          grep -q "^## \[$new\]" CHANGELOG.md || { echo "::error::CHANGELOG.md needs a '## [$new]' section"; exit 1; }
          if git rev-parse -q --verify "refs/tags/v$new" >/dev/null; then echo "::error::Tag v$new already exists"; exit 1; fi

  tests:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      # No network, no Hermes, no API keys: the suite uses fixtures and fakes.
      - run: python -m pytest -q

  shell:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck -S warning bootstrap.sh hermes/install.sh hermes/uninstall.sh hermes/cron/create-jobs.sh hermes/scripts/*.sh
      - run: for f in bootstrap.sh hermes/install.sh hermes/uninstall.sh hermes/cron/create-jobs.sh hermes/scripts/*.sh; do bash -n "$f"; done
